<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <header class="header">
    <img src="assets/icon.png" alt="" />
    <div>
      <h1>Honest Thumbnails</h1>
      <p>Swaps clickbait thumbnails for a real frame from the middle of the video.</p>
    </div>
  </header>

  <!-- Video: https://www.youtube.com/watch?v=3RP6GyCtOAA
       before = i.ytimg.com/vi/3RP6GyCtOAA/maxresdefault.jpg (uploader's thumbnail)
       after  = i.ytimg.com/vi/3RP6GyCtOAA/maxres2.jpg      (YouTube's mid-video frame) -->
  <section class="pair">
    <div>
      <span class="label before">Before</span>
      <div class="thumb">
        <img src="assets/3RP6GyCtOAA-maxresdefault.jpg" alt="" />
        <span class="duration">18:07</span>
      </div>
    </div>
    <div>
      <span class="label after">After</span>
      <div class="thumb">
        <img src="assets/3RP6GyCtOAA-maxres2.jpg" alt="" />
        <span class="duration">18:07</span>
      </div>
    </div>
  </section>
</body>
</html>
